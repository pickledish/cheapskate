name: MCP tool checks

on:
  pull_request:
    paths:
      - "mcp/**"
      - "supabase/migrations/**"
      - ".github/workflows/mcp.yml"
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - "supabase/migrations/**"
      - ".github/workflows/mcp.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format

      - name: Build
        run: npm run build

      # Starts Postgres, auth and PostgREST in Docker with this repo's
      # migrations, then runs the tests against them.
      - name: Test
        run: npm test
